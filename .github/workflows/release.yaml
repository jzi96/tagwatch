name: Build and Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD

      - name: Run Go checks and tests
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/tagwatch:latest .

      - name: Push to Docker Hub (main or release tags only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          
          # Tag with git commit SHA and latest
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/tagwatch"
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          
          docker tag "$IMAGE_NAME:latest" "$IMAGE_NAME:$SHORT_SHA"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$SHORT_SHA"
          
          # If triggered by a git tag (e.g. v1.2.0), also push that exact version tag
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            docker tag "$IMAGE_NAME:latest" "$IMAGE_NAME:$RELEASE_TAG"
            docker push "$IMAGE_NAME:$RELEASE_TAG"
          fi